[project]
name = "das-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "peachfuzz11", email = "pederh11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
]

[project.scripts]
das-utils = "das_utils:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
